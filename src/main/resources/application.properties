spring.application.name=backend
server.port=8080

# Cấu hình kết nối PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- CẤU HÌNH JWT (Token xác thực) ---
# Chuỗi bí mật dùng để ký token
erp.app.jwtSecret=mySuperSecretKeyForERPWarehouseManagementSystemProject2026SecureKey
# Thời gian token hết hạn (86400000 ms = 24 giờ)
erp.app.jwtExpirationMs=86400000

# --- CẤU HÌNH GỬI EMAIL (SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=okluon123pk@gmail.com
spring.mail.password=gualgluljrchyddz
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- CẤU HÌNH ĐỊA CHỈ HỆ THỐNG ---
# Địa chỉ Frontend và người gửi mail
erp.app.frontendUrl=http://localhost:5173
erp.app.mailFrom=okluon123pk@gmail.com

# Thời hạn token đặt lại mật khẩu (30 phút = 1800000 ms)
erp.app.resetPasswordExpirationMs=1800000
# Đường dẫn trang web Frontend nhận đặt lại mật khẩu
erp.app.resetPasswordUrl=http://localhost:5173/reset-password

# --- CHỐNG SPAM "QUÊN MẬT KHẨU" ---
# Hai lần gửi mail liên tiếp phải cách nhau bao nhiêu giây
erp.app.forgot-password.cooldown-seconds=60
# Nhập email chưa đăng ký sai bao nhiêu lần thì khoá, khoá bao nhiêu giây
erp.app.forgot-password.max-wrong-attempts=5
erp.app.forgot-password.lock-seconds=60
# Khi TEST trên máy, có thể hạ xuống mà KHÔNG sửa file này, bằng cách chạy:
#   .\mvnw spring-boot:run "-Dspring-boot.run.arguments=--erp.app.forgot-password.cooldown-seconds=10 --erp.app.forgot-password.lock-seconds=10"

# --- CẤU HÌNH TẢI FILE & ẢNH ĐẠI DIỆN (S2-03) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
erp.app.upload.avatar-dir=uploads/avatars

# S5-06: Số ngày giữ chỗ tồn tối đa cho đơn chờ duyệt / đã duyệt chưa soạn hàng; quá hạn hệ thống tự nhả tồn và huỷ đơn
erp.order.reservation-days=7
erp.order.reservation-expiry.enabled=true
